        Beijing, China", "name": "Yu Zhang"}, {"orcid_id": "https://orcid.org/0000-0002-0291-5453",
        "affiliation": "State Key Laboratory of Robotics and System, Harbin Institute
        of Technology (HIT), Harbin, China", "name": "Dong-Mei Wu"}, {"orcid_id":
        "https://orcid.org/0000-0002-1211-6444", "affiliation": "State Key Laboratory
        of Robotics and System, Harbin Institute of Technology (HIT), Harbin, China",
        "name": "Wei Dong"}], "link": [{"type": "fulltext", "url": "https://ieeexplore.ieee.org/document/8897544/"}],
        "abstract": "This paper describes a system design and hybrid control algorithm
        of an electrically actuated lower limb exoskeleton (LLE). The system design
        mainly includes three parts: mechanical structure design, actuation system
        design and sensor system design. According to the initial state of the joint
        angle, LLE can be divided into Non-anthropomorphic state (NAS) and anthropomorphic
        state (AS). The human motion intention (HMI) estimation can be divided into
        gait phase classification and reference trajectory estimation. The fuzzy logic
        is used to detect different phases in the gait phase classification. In the
        reference trajectory estimation, the kinematic model of the LLE is utilized
        to obtain a continuous joint trajectory, which is used as input of the control
        law. To make the LLE accurately follow the movement of people and remain stable,
        a hybrid dual-mode control strategy is proposed in this paper, i.e., the adaptive
        impedance control (AIC) method is used to improve the stability and resistance
        to shock in stance phase, and the active disturbance rejection control with
        the fast terminal sliding mode control (ADRC-FTSMC) method is employed to
        improve the response speed and the tracking precision in swing phase. Furthermore,
        in order to solve the torque discontinuity in the switching process, a smoothing
        method is proposed during the transition. Finally, the prototype experiments
        were set up to verify the tracking performance and power-assisted effect of
        the proposed exoskeleton. The experiments results show the LLE can achieve
        excellent tracking performance and power-assisted effect based on the proposed
        HMI methodology and hybrid dual-mode control strategy.", "title": "Development
        and Hybrid Control of an Electrically Actuated Lower Limb Exoskeleton for
        Motion Assistance"}, "id": "00001267b59f4e5a9376d761e30da899", "created_date":
        "2021-03-30T01:58:36Z"}, {"last_updated": "2025-08-19T19:55:23Z", "bibjson":
        {"identifier": [{"id": "1751-8733", "type": "eissn"}, {"id": "1751-8725",
        "type": "pissn"}, {"id": "10.1049/mia2.12215", "type": "doi"}], "journal":
        {"volume": "16", "number": "1", "country": "GB", "issns": ["1751-8725", "1751-8733"],
