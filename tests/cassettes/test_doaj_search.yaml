        & Propagation"}, "month": "01", "end_page": "28", "keywords": ["directional
        couplers", "power dividers"], "year": "2022", "start_page": "18", "subject":
        [{"code": "TK5101-6720", "scheme": "LCC", "term": "Telecommunication"}, {"code":
        "QC501-766", "scheme": "LCC", "term": "Electricity and magnetism"}], "author":
        [{"affiliation": "The School of Electronic Science & Engineering Nanjing University
        of Posts and Telecommunications Nanjing China", "name": "Xiaojun Hu"}, {"affiliation":
        "The School of Electronic Science & Engineering Nanjing University of Posts
        and Telecommunications Nanjing China", "name": "Feng Xu"}], "link": [{"content_type":
        "HTML", "type": "fulltext", "url": "https://doi.org/10.1049/mia2.12215"}],
        "abstract": "Abstract In this study, a novel coupling structure based on half\u2010mode
        substrate\u2010integrated waveguide (HMSIW) is proposed with a small size
        and broad bandwidth. The HMSIW coupler is realised by connecting their equivalent
        magnetic walls with metal strips, which avoids exposing the semi\u2010enclosed
        magnetic walls outside. Hence, it has greater anti\u2010interference capability
        than the existing HMSIW couplers. The directional coupling principle is introduced
        by analysing the proposed single connecting strip coupler. In order to lower
        return loss and higher isolation, a 3\u00a0dB directional coupler working
        from 10.8 to 16.8\u00a0GHz is designed with two connecting strips. Finally,
        a six\u2010port circuit is achieved by utilising this compact 3\u00a0dB directional
        coupler. Furthermore, a broadband HMSIW power divider is optimised to satisfy
        the performance of this six\u2010port circuit. The proposed coupler with metal
        strips helps to increase bandwidth and reduce size, which makes it more applicable
        to demanding systems with complex requirements such as detecting and transceiver
        systems. The 3\u00a0dB coupler and six\u2010port circuit are fabricated and
        measured. The measured results are in accordance with the simulated data.",
        "title": "A six\u2010port network based on substrate integrated waveguide
        coupler with metal strips"}, "id": "00005d71bbd540f8a3720414757f656e", "created_date":
        "2021-12-23T11:57:34Z"}, {"last_updated": "2025-08-20T01:10:08Z", "bibjson":
        {"identifier": [{"id": "2169-3536", "type": "eissn"}, {"id": "10.1109/ACCESS.2023.3325252",
        "type": "doi"}], "journal": {"volume": "11", "country": "US", "issns": ["2169-3536"],
        "publisher": "IEEE", "language": ["EN"], "title": "IEEE Access"}, "end_page":
        "115414", "keywords": ["Interference sensing", "duration units of frequency
        points", "LFM interference"], "year": "2023", "start_page": "115403", "subject":
        [{"code": "TK1-9971", "scheme": "LCC", "term": "Electrical engineering. Electronics.
        Nuclear engineering"}], "author": [{"orcid_id": "https://orcid.org/0000-0003-0558-444X",
        "affiliation": "School of Information and Electronics, Beijing Institute of
        Technology, Beijing, China", "name": "Duo Wang"}, {"orcid_id": "https://orcid.org/0000-0002-3048-9949",
        "affiliation": "School of Information and Electronics, Beijing Institute of
        Technology, Beijing, China", "name": "Ju Wang"}, {"orcid_id": "https://orcid.org/0000-0002-9309-3407",
        "affiliation": "School of Information and Electronics, Beijing Institute of
        Technology, Beijing, China", "name": "Yi Zhong"}], "link": [{"type": "fulltext",
        "url": "https://ieeexplore.ieee.org/document/10286823/"}], "abstract": "The
        adaptive Frequency-Hopping(FH) technique based on interference sensing can
        further enhance the anti-interference performance of hybrid Direct-Sequence/FH
        Spread Spectrum(DS/FH SS) system and FH Orthogonal Frequency Division Multiplexing(FH-OFDM)
        system. Existing interference sensing algorithms cannot provide an accurate
        detection performance for both stationary and non-stationary LFM interference,
        and have the problem of misjudging useful signal as interference due to the
        dynamic time-frequency characteristics of useful signal. To improve the sensing
        detection capability with low false alarm rate, this paper proposes an algorithm,
        by analyzing the duration units of frequency points and combining the least-squares
        fitting method to sense stationary and non-stationary LFM interference. Simulations
        have been carried out to demonstrate the effectiveness of our interference
        sensing algorithm.", "title": "An Interference Sensing Algorithm Based on
        Duration Units of Frequency Points for Adaptive Frequency-Hopping System"},
