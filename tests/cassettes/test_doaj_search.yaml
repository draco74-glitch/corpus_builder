        "abstract": "The method for assessing a channel capacity and productivity
        of fiber-optic communication line (FOCL) based on the DWDM (Dense Wavelength
        Division Multiplexing) technology is proposed. The interrelation between noise-immunity
        factors and information characteristics of FOCL is highlighted.", "title":
