        article-formatted-body article-formatted-body_version-2\"><div xmlns=\"http://www.w3.org/1999/xhtml\"><p>\u041D\u0430\_\u0441\u0435\u0433\u043E\u0434\u043D\u044F\u0448\u043D\u0438\u0439
        \u0434\u0435\u043D\u044C \u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u043A\u0430
        \u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u043E\u0447\u0435\u043D\u044C
        \u0432\u0430\u0436\u043D\u043E\u0439 \u0447\u0430\u0441\u0442\u044C\u044E
        \u0432\_\u043B\u044E\u0431\u043E\u0439 \u0441\u0438\u0441\u0442\u0435\u043C\u0435
        \u0431\u0430\u0437 \u0434\u0430\u043D\u043D\u044B\u0445. \u0420\u0435\u0447\u044C
        \u0438\u0434\u0435\u0442 \u043E\_\u0440\u0430\u0441\u043F\u043E\u043B\u043E\u0436\u0435\u043D\u0438\u0438
        \u0434\u0430\u043D\u043D\u044B\u0445 \u0432\_\u043F\u043E\u0440\u044F\u0434\u043A\u0435
        \u0432\u043E\u0437\u0440\u0430\u0441\u0442\u0430\u043D\u0438\u044F \u0438\u043B\u0438\_\u0443\u0431\u044B\u0432\u0430\u043D\u0438\u044F.
        \u041C\u044B \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u043C
        \u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u043A\u0443 \u0434\u043B\u044F\_\u0433\u0435\u043D\u0435\u0440\u0430\u0446\u0438\u0438
        \u043F\u043E\u0441\u043B\u0435\u0434\u043E\u0432\u0430\u0442\u0435\u043B\u044C\u043D\u043E\u0433\u043E
        \u0432\u044B\u0432\u043E\u0434\u0430, \u0430\_\u0442\u0430\u043A\u0436\u0435
        \u0434\u043B\u044F\_\u0432\u044B\u043F\u043E\u043B\u043D\u0435\u043D\u0438\u044F
        \u0443\u0441\u043B\u043E\u0432\u0438\u0439 \u0440\u0430\u0437\u043B\u0438\u0447\u043D\u044B\u0445
        <a href=\"https://otus.pw/a14fx/\">\u0430\u043B\u0433\u043E\u0440\u0438\u0442\u043C\u043E\u0432</a>,
        \u0440\u0430\u0431\u043E\u0442\u0430\u044E\u0449\u0438\u0445 \u0441\_\u0431\u0430\u0437\u0430\u043C\u0438
        \u0434\u0430\u043D\u043D\u044B\u0445. </p><p>\u041F\u0440\u0438\_\u043E\u0431\u0440\u0430\u0431\u043E\u0442\u043A\u0435
        \u0437\u0430\u043F\u0440\u043E\u0441\u043E\u0432 \u0434\u043B\u044F\_\u044D\u0444\u0444\u0435\u043A\u0442\u0438\u0432\u043D\u043E\u0433\u043E
        \u0432\u044B\u043F\u043E\u043B\u043D\u0435\u043D\u0438\u044F \u0440\u0430\u0437\u043B\u0438\u0447\u043D\u044B\u0445
        \u0440\u0435\u043B\u044F\u0446\u0438\u043E\u043D\u043D\u044B\u0445 \u043E\u043F\u0435\u0440\u0430\u0446\u0438\u0439,
        \u0442\u0430\u043A\u0438\u0445 \u043A\u0430\u043A\_join \u0438 \u0442\u0430\u043A
        \u0434\u0430\u043B\u0435\u0435, \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u044E\u0442\u0441\u044F
        \u0440\u0430\u0437\u043B\u0438\u0447\u043D\u044B\u0435 \u043C\u0435\u0442\u043E\u0434\u044B
        \u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u043A\u0438, \u043F\u043E\u0442\u043E\u043C\u0443
        \u0447\u0442\u043E\_\u043A\u043E\u0440\u0440\u0435\u043A\u0442\u043D\u043E\u0439
        \u0440\u0430\u0431\u043E\u0442\u044B \u0431\u043E\u043B\u044C\u0448\u0438\u043D\u0441\u0442\u0432\u0430
        \u0437\u0430\u043F\u0440\u043E\u0441\u043E\u0432 \u0441\u0438\u0441\u0442\u0435\u043C\u0435
        \u043D\u0435\u043E\u0431\u0445\u043E\u0434\u0438\u043C\u043E \u043F\u0440\u0435\u0434\u043E\u0441\u0442\u0430\u0432\u043B\u044F\u0442\u044C
        \u043E\u0442\u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u044B\u0435
        \u0432\u0445\u043E\u0434\u043D\u044B\u0435 \u0434\u0430\u043D\u043D\u044B\u0435.
        </p><p>\u0415\u0441\u043B\u0438 \u0433\u043E\u0432\u043E\u0440\u0438\u0442\u044C
        \u043E\_\u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u043A\u0435 \u043E\u0442\u043D\u043E\u0448\u0435\u043D\u0438\u044F,
        \u0442\u043E \u043C\u044B \u0434\u043E\u043B\u0436\u043D\u044B \u043F\u043E\u0441\u0442\u0440\u043E\u0438\u0442\u044C
        \u0438\u043D\u0434\u0435\u043A\u0441 \u043F\u043E\_\u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u043E\u0447\u043D\u043E\u043C\u0443
        \u043A\u043B\u044E\u0447\u0443 \u0438 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C
        \u044D\u0442\u043E\u0442 \u0438\u043D\u0434\u0435\u043A\u0441 \u0434\u043B\u044F\_\u0441\u0447\u0438\u0442\u044B\u0432\u0430\u043D\u0438\u044F
        \u043E\u0442\u043D\u043E\u0448\u0435\u043D\u0438\u044F \u0432\_\u043E\u0442\u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u043E\u043C
        \u043F\u043E\u0440\u044F\u0434\u043A\u0435. </p><p>\u041E\u0434\u043D\u0430\u043A\u043E,
        \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u044F \u0438\u043D\u0434\u0435\u043A\u0441,
        \u043C\u044B \u0441\u043E\u0440\u0442\u0438\u0440\u0443\u0435\u043C \u043E\u0442\u043D\u043E\u0448\u0435\u043D\u0438\u0435
        \u043B\u043E\u0433\u0438\u0447\u0435\u0441\u043A\u0438, \u0430\_\u043D\u0435\_\u0444\u0438\u0437\u0438\u0447\u0435\u0441\u043A\u0438.
        \u0422\u0430\u043A\u0438\u043C \u043E\u0431\u0440\u0430\u0437\u043E\u043C,
        \u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u043A\u0430 \u043C\u043E\u0436\u0435\u0442
        \u0441\u0442\u043E\u043B\u043A\u043D\u0443\u0442\u044C\u0441\u044F \u0441\_\u0434\u0432\u0443\u043C\u044F
        \u0441\u043B\u0443\u0447\u0430\u044F\u043C\u0438:</p><p><strong>\u0421\u043B\u0443\u0447\u0430\u0439
        \u043F\u0435\u0440\u0432\u044B\u0439:</strong> \u041E\u0442\u043D\u043E\u0448\u0435\u043D\u0438\u0435
        \u0438\u043C\u0435\u0435\u0442 \u043C\u0435\u043D\u044C\u0448\u0438\u0439
        \u0440\u0430\u0437\u043C\u0435\u0440 \u0432\_\u0441\u0440\u0430\u0432\u043D\u0435\u043D\u0438\u0438
        \u0441\_\u0434\u043E\u0441\u0442\u0443\u043F\u043D\u043E\u0439 \u043E\u043F\u0435\u0440\u0430\u0442\u0438\u0432\u043D\u043E\u0439
        \u043F\u0430\u043C\u044F\u0442\u044C\u044E.</p><p><strong>\u0421\u043B\u0443\u0447\u0430\u0439
        \u0432\u0442\u043E\u0440\u043E\u0439:</strong> \u041E\u0442\u043D\u043E\u0448\u0435\u043D\u0438\u0435
        \u043F\u0440\u0435\u0432\u044B\u0448\u0430\u0435\u0442 \u0440\u0430\u0437\u043C\u0435\u0440
        \u0434\u043E\u0441\u0442\u0443\u043F\u043D\u043E\u0439 \u043E\u043F\u0435\u0440\u0430\u0442\u0438\u0432\u043D\u043E\u0439
        \u043F\u0430\u043C\u044F\u0442\u0438.</p><p>\u0412\_\u043F\u0435\u0440\u0432\u043E\u043C
        \u0441\u043B\u0443\u0447\u0430\u0435 \u043E\u0442\u043D\u043E\u0448\u0435\u043D\u0438\u044F
        \u043C\u0430\u043B\u043E\u0433\u043E \u0438\u043B\u0438\_\u0441\u0440\u0435\u0434\u043D\u0435\u0433\u043E
        \u0440\u0430\u0437\u043C\u0435\u0440\u0430 \u043D\u0435\_\u0432\u044B\u0445\u043E\u0434\u044F\u0442
        \u0437\u0430\_\u0440\u0430\u043C\u043A\u0438 \u0434\u043E\u0441\u0442\u0443\u043F\u043D\u043E\u0439
        \u043E\u043F\u0435\u0440\u0430\u0442\u0438\u0432\u043D\u043E\u0439 \u043F\u0430\u043C\u044F\u0442\u0438.
        \u042D\u0442\u043E \u0437\u043D\u0430\u0447\u0438\u0442, \u0447\u0442\u043E\_\u043C\u044B
        \u043C\u043E\u0436\u0435\u043C \u043F\u043E\u043B\u043D\u043E\u0441\u0442\u044C\u044E
        \u0443\u043C\u0435\u0441\u0442\u0438\u0442\u044C \u0438\u0445 \u0432\_\u043E\u043F\u0435\u0440\u0430\u0442\u0438\u0432\u043D\u043E\u0439
        \u043F\u0430\u043C\u044F\u0442\u0438. \u0422\u0430\u043A\u0438\u043C \u043E\u0431\u0440\u0430\u0437\u043E\u043C,
        \u0432\_\u044D\u0442\u043E\u043C \u0441\u043B\u0443\u0447\u0430\u0435 \u043C\u044B
        \u043C\u043E\u0436\u0435\u043C \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C
        \u0441\u0442\u0430\u043D\u0434\u0430\u0440\u0442\u043D\u044B\u0435 \u043C\u0435\u0442\u043E\u0434\u044B
        \u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u043A\u0438, \u0442\u0430\u043A\u0438\u0435
        \u043A\u0430\u043A\_quicksort, \u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u043A\u0430
        \u0441\u043B\u0438\u044F\u043D\u0438\u0435\u043C \u0438 \u0442\u0430\u043A
        \u0434\u0430\u043B\u0435\u0435</p><p>\u0412\u043E\_\u0432\u0442\u043E\u0440\u043E\u043C
        \u0441\u043B\u0443\u0447\u0430\u0435 \u0441\u0442\u0430\u043D\u0434\u0430\u0440\u0442\u043D\u044B\u0435
        \u0430\u043B\u0433\u043E\u0440\u0438\u0442\u043C\u044B \u0443\u0436\u0435
        \u043D\u0435\_\u0431\u0443\u0434\u0443\u0442 \u0440\u0430\u0431\u043E\u0442\u0430\u0442\u044C
        \u043A\u043E\u0440\u0440\u0435\u043A\u0442\u043D\u043E. \u0418\u043C\u0435\u043D\u043D\u043E
        \u0434\u043B\u044F\_\u0442\u0430\u043A\u0438\u0445 \u043E\u0442\u043D\u043E\u0448\u0435\u043D\u0438\u0439,
        \u0440\u0430\u0437\u043C\u0435\u0440 \u043A\u043E\u0442\u043E\u0440\u044B\u0445
        \u0432\u044B\u0445\u043E\u0434\u0438\u0442 \u0437\u0430\_\u0440\u0430\u043C\u043A\u0438
        \u0434\u043E\u0441\u0442\u0443\u043F\u043D\u043E\u0439 \u043E\u043F\u0435\u0440\u0430\u0442\u0438\u0432\u043D\u043E\u0439
        \u043F\u0430\u043C\u044F\u0442\u0438, \u043C\u044B \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u043C
        \u0430\u043B\u0433\u043E\u0440\u0438\u0442\u043C \u0432\u043D\u0435\u0448\u043D\u0435\u0439
        \u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u043A\u0438 \u0441\u043B\u0438\u044F\u043D\u0438\u0435\u043C
        (External Merge Sort).</p><p>\u0413\u0440\u0443\u043F\u043F\u0430 \u043C\u0435\u0442\u043E\u0434\u043E\u0432
        \u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u043A\u0438 \u043E\u0442\u043D\u043E\u0448\u0435\u043D\u0438\u0439,
        \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u043D\u0435\_\u043F\u043E\u043C\u0435\u0449\u0430\u044E\u0442\u0441\u044F
        \u0432\_\u043E\u043F\u0435\u0440\u0430\u0442\u0438\u0432\u043D\u0443\u044E
        \u043F\u0430\u043C\u044F\u0442\u044C \u0438\u0437\u2011\u0437\u0430 \u0441\u0432\u043E\u0435\u0433\u043E,
        \u0432\_\u0441\u043E\u0432\u043E\u043A\u0443\u043F\u043D\u043E\u0441\u0442\u0438
        \u043D\u0430\u0437\u044B\u0432\u0430\u0435\u0442\u0441\u044F <strong>\u0432\u043D\u0435\u0448\u043D\u0435\u0439
        \u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u043A\u043E\u0439 (External
        Sorting)</strong>. \u041D\u0430\u0438\u0431\u043E\u043B\u0435\u0435 \u043F\u043E\u0434\u0445\u043E\u0434\u044F\u0449\u0438\u043C
        \u0434\u043B\u044F\_\u044D\u0442\u043E\u0439 \u0437\u0430\u0434\u0430\u0447\u0438
        \u043C\u0435\u0442\u043E\u0434\u043E\u043C \u0432\u043D\u0435\u0448\u043D\u0435\u0439
        \u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u043A\u0438 \u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F
        \u0430\u043B\u0433\u043E\u0440\u0438\u0442\u043C \u0432\u043D\u0435\u0448\u043D\u0435\u0439
        \u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u043A\u0438 \u0441\u043B\u0438\u044F\u043D\u0438\u0435\u043C.</p><h3>\u0410\u043B\u0433\u043E\u0440\u0438\u0442\u043C
        \u0432\u043D\u0435\u0448\u043D\u0435\u0439 \u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u043A\u0438
        \u0441\u043B\u0438\u044F\u043D\u0438\u0435\u043C (External Merge Sort)</h3><p>\u041D\u0438\u0436\u0435
        \u043C\u044B \u043F\u043E\u0434\u0440\u043E\u0431\u043D\u043E \u0440\u0430\u0437\u0431\u0435\u0440\u0435\u043C
        \u0432\u0441\u0435 \u044D\u0442\u0430\u043F\u044B \u0430\u043B\u0433\u043E\u0440\u0438\u0442\u043C\u0430
        \u0432\u043D\u0435\u0448\u043D\u0435\u0439 \u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u043A\u0438
        \u0441\u043B\u0438\u044F\u043D\u0438\u0435\u043C:</p><p><strong>M</strong>
        \u0432\_\u0430\u043B\u0433\u043E\u0440\u0438\u0442\u043C\u0435 \u043E\u0437\u043D\u0430\u0447\u0430\u0435\u0442
        \u043A\u043E\u043B\u0438\u0447\u0435\u0441\u0442\u0432\u043E \u0434\u0438\u0441\u043A\u043E\u0432\u044B\u0445
        \u0431\u043B\u043E\u043A\u043E\u0432, \u0434\u043E\u0441\u0442\u0443\u043F\u043D\u044B\u0445
        \u0432\_\u0431\u0443\u0444\u0435\u0440\u0435 \u043E\u043F\u0435\u0440\u0430\u0442\u0438\u0432\u043D\u043E\u0439
        \u043F\u0430\u043C\u044F\u0442\u0438 \u0434\u043B\u044F\_\u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u043A\u0438.</p><p><strong>\u042D\u0442\u0430\u043F
        1:</strong> \u0418\u0437\u043D\u0430\u0447\u0430\u043B\u044C\u043D\u043E \u043C\u044B
        \u0441\u043E\u0437\u0434\u0430\u0435\u043C \u043D\u0435\u0441\u043A\u043E\u043B\u044C\u043A\u043E
        \u043E\u0442\u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u044B\u0445
