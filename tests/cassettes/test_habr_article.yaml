        781w\" loading=\"lazy\" decode=\"async\"/></figure><p>\u0414\u043E\u043F\u0443\u0441\u0442\u0438\u043C,
        \u043C\u044B \u0432\u044B\u043F\u043E\u043B\u043D\u044F\u0435\u043C \u0432\u043D\u0435\u0448\u043D\u044E\u044E
        \u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u043A\u0443 \u0441\u043B\u0438\u044F\u043D\u0438\u0435\u043C
        \u0434\u043B\u044F\_\u043E\u0442\u043D\u043E\u0448\u0435\u043D\u0438\u044F
        R. \u041F\u0440\u0438\_\u044D\u0442\u043E\u043C \u043F\u0440\u0435\u0434\u043F\u043E\u043B\u043E\u0436\u0438\u043C,
