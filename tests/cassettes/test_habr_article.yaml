        \u043D\u0435\_\u0431\u043E\u043B\u0435\u0435 \u0442\u0440\u0435\u0445 \u0431\u043B\u043E\u043A\u043E\u0432.
        \u0422\u0430\u043A\u0438\u043C \u043E\u0431\u0440\u0430\u0437\u043E\u043C,
        \u043F\u0440\u0438\_\u043E\u0431\u0440\u0430\u0431\u043E\u0442\u043A\u0435
        \u043D\u0430\_\u0432\u0442\u043E\u0440\u043E\u043C \u044D\u0442\u0430\u043F\u0435,
