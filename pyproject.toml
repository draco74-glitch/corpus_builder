[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-builder"
version = "0.2.0"
description = "Сборщик сырого корпуса для pretraining LLM с дедупликацией и нормализацией"
requires-python = ">=3.10"
authors = [{name = "CorpusBuilder"}]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "pydantic>=2.5",
    "python-slugify>=8.0",
    "loguru>=0.7",
    "tqdm>=4.66",
    "click>=8.1",
    "trafilatura>=1.9",
    "beautifulsoup4>=4.12",
    "charset-normalizer>=3.3",
    "ftfy>=6.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pymupdf>=1.23",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "datasketch>=1.6",
    "fasttext-langdetect>=1.0.0",
    "kenlm>=0.3.0",
    "pdfplumber>=0.10",
    "aiohttp>=3.9",
    "requests-cache>=1.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "vcrpy>=5.1", "ruff>=0.1"]
gui = ["PySide6>=6.6", "matplotlib>=3.8", "pyarrow>=15.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
corpus-builder = "corpus_builder.cli:main"

[project.gui-scripts]
corpus-builder-gui = "corpus_builder.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["corpus_builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
